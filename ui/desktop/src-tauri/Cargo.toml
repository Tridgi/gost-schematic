[package]
name = "gost-cad-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "gost_cad_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "=2.12.5" }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
