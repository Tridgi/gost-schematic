<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="175mm" viewBox="0 0 240 175" data-document-type="Э1" data-approval-status="DRAFT" data-font-compliance="UNVERIFIED" data-graph-semantics="logical-process-only" data-physical-netlist="none">
  <title>Э1 — семиблочный учебный пример (не утвержденная ЕСКД схема)</title>
