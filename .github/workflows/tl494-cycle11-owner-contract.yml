name: YGO Cycle15 real 23 TL494 source ink + actual NET PAINT IC RECON

on:
  push:
    branches: [parallel/catalog-tl494-source-fidelity-cycle9]
    paths:
      - "src/gost_schematic/catalog/source_footprints.py"
      - "src/gost_schematic/catalog/source_digest.py"
      - "src/gost_schematic/catalog/source_profiles.py"
      - "src/gost_schematic/catalog/source_profiles/**"
      - "examples/review_tl494_ugo_source_cycle9.py"
      - "scripts/verify_tl494_cycle11_owner_strokes.py"
      - "scripts/export_tl494_23_ink_contract.py"
      - "reports/tl494-cycle15-true-23-ink.*"
      - ".github/workflows/tl494-cycle11-owner-contract.yml"
  pull_request:
    branches: [integration/stage0-12]
    paths:
      - "src/gost_schematic/catalog/source_footprints.py"
      - "src/gost_schematic/catalog/source_profiles.py"
      - "src/gost_schematic/catalog/source_profiles/**"
      - "examples/review_tl494_ugo_source_cycle9.py"
      - "scripts/verify_tl494_cycle11_owner_strokes.py"
      - "scripts/export_tl494_23_ink_contract.py"
      - "reports/tl494-cycle15-true-23-ink.*"
      - ".github/workflows/tl494-cycle11-owner-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-owner-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: net
            python-version: "3.12"
            owner_sha: "b2a7a46c2f031dd125dd0879c9d59d24e27decbf"
          - owner: net
            python-version: "3.13"
            owner_sha: "b2a7a46c2f031dd125dd0879c9d59d24e27decbf"
          - owner: paint
            python-version: "3.12"
            owner_sha: "252fed9077351493378348f4c0a0138c5e04c8b5"
          - owner: paint
            python-version: "3.13"
            owner_sha: "252fed9077351493378348f4c0a0138c5e04c8b5"
          - owner: ic
            python-version: "3.12"
            owner_sha: "632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617"
          - owner: ic
            python-version: "3.13"
            owner_sha: "632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617"
          - owner: recon
            python-version: "3.12"
            owner_sha: "88ec53babdcbb4246986b787816c999cda1e7f6d"
          - owner: recon
            python-version: "3.13"
            owner_sha: "88ec53babdcbb4246986b787816c999cda1e7f6d"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the same project runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff current independent YGO/owner contract source
        run: ruff check scripts/verify_tl494_cycle11_owner_strokes.py scripts/export_tl494_23_ink_contract.py
      - name: Restore pinned OpenGOST Type A cache (source-only, never uploaded)
        uses: actions/cache@v4
        with:
          path: .font-cycle15
          key: open-gost-v07-typea-${{ runner.os }}-f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
      - name: Fetch exact owner HEAD and overlay ONLY read-only YGO modules in temporary worktree
        env:
          OWNER_SHA: ${{ matrix.owner_sha }}
          OWNER: ${{ matrix.owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin "$OWNER_SHA"
          git worktree add --detach "$RUNNER_TEMP/ygo-owner" "$OWNER_SHA"
          test "$(git -C "$RUNNER_TEMP/ygo-owner" rev-parse HEAD)" = "$OWNER_SHA"
          mkdir -p "$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog/source_profiles"
          cp src/gost_schematic/catalog/source_digest.py "$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog/"
          cp src/gost_schematic/catalog/source_footprints.py "$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog/"
          cp src/gost_schematic/catalog/source_profiles.py "$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog/"
          cp src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json "$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog/source_profiles/"
          cp examples/review_tl494_ugo_source_cycle9.py "$RUNNER_TEMP/ygo-owner/examples/"
          # Keep source-approved REAL JSON models, not synthetic glyph shims.
          # Older owner trees can lack some of the original physical catalog.
          # Fill only ABSENT files in an isolated checkout; if a file exists
          # with different bytes, FAIL rather than silently overwrite ink.
          SOURCE_CATALOG="$GITHUB_WORKSPACE/src/gost_schematic/catalog"
          OWNER_CATALOG="$RUNNER_TEMP/ygo-owner/src/gost_schematic/catalog"
          for model in capacitors/fixed capacitors/polarized diodes/schottky fuses/general resistors/variable transistors/mosfet_n_enh; do
            for kind in parts symbols; do
              original="$SOURCE_CATALOG/$kind/$model.json"
              target="$OWNER_CATALOG/$kind/$model.json"
              test -f "$original"
              mkdir -p "$(dirname "$target")"
              if test -e "$target"; then
                if ! cmp -s "$original" "$target"; then
                  echo "::error::SOURCE_CATALOG_DRIFT:$kind/$model.json"
                  exit 1
                fi
              else
                cp "$original" "$target"
              fi
            done
          done
          original="$SOURCE_CATALOG/inductors/inductor.ferromagnetic.json"
          target="$OWNER_CATALOG/inductors/inductor.ferromagnetic.json"
          mkdir -p "$(dirname "$target")"
          if test -e "$target"; then
            cmp -s "$original" "$target" || { echo "::error::SOURCE_FERROMAGNETIC_PROFILE_DRIFT"; exit 1; }
          else
            cp "$original" "$target"
          fi
          # RECON PR115 is reference-based: use ONLY real IC #97 code
          # pinned by SHA, staged temporarily just as RECON owner does in
          # its genuine current-owner integration CI. No fake signatures.
          if test "$OWNER" = recon; then
            IC_SHA="632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617"
            git fetch --no-tags --depth=1 origin "$IC_SHA"
            for file in ic.py tl494cn.py ic_pin_alias.py ic_serde.py ic_paint_bridge.py ic_graphic_revision.py ic_circuit_adapter.py ic_editor_targets.py; do
              git show "$IC_SHA:src/gost_schematic/electrical/$file" > "$RUNNER_TEMP/ygo-owner/src/gost_schematic/electrical/$file"
            done
            # The reference-based RECON owner ALSO imports real PAINT
            # modules. Without this exact stage Python fails before testing
            # any source UGO (previous Cycle13 GitHub CI failure).
            PAINT_SHA="252fed9077351493378348f4c0a0138c5e04c8b5"
            git fetch --no-tags --depth=1 origin "$PAINT_SHA"
            mkdir -p "$RUNNER_TEMP/ygo-owner/src/gost_schematic/rendering"
            for file in ic_rectangular.py ic_hotspots.py ic_orientation.py ic_power_profiles.py ic_tl494_profile.py ic_electrical_binding.py ic_sheet_composition.py external_wire_sheet.py native_sheet_ink_audit.py routed_native_sheet.py sheet_svg.py; do
              git show "$PAINT_SHA:src/gost_schematic/rendering/$file" > "$RUNNER_TEMP/ygo-owner/src/gost_schematic/rendering/$file"
            done
            mkdir -p "$RUNNER_TEMP/ygo-owner/tests/fixtures"
            git show "$IC_SHA:examples/tl494_cycle9_circuit_integration.py" > "$RUNNER_TEMP/ygo-owner/examples/tl494_cycle9_circuit_integration.py"
            git show "$IC_SHA:tests/fixtures/tl494_photo_23_frozen_cycle9.json" > "$RUNNER_TEMP/ygo-owner/tests/fixtures/tl494_photo_23_frozen_cycle9.json"
            echo "PINNED_REAL_IC_OWNER=$IC_SHA; PINNED_REAL_PAINT_OWNER=$PAINT_SHA; RECON_OWNER=$OWNER_SHA"
          fi
          mkdir -p output/cycle11-owners
          cd "$RUNNER_TEMP/ygo-owner"
          PYTHONPATH="$PWD/src:$PWD" python "$GITHUB_WORKSPACE/scripts/verify_tl494_cycle11_owner_strokes.py" \
            --owner "$OWNER" --owner-sha "$OWNER_SHA" \
            --output "$GITHUB_WORKSPACE/output/cycle11-owners/$OWNER.json"
          sha256sum "$GITHUB_WORKSPACE/output/cycle11-owners/$OWNER.json" > "$GITHUB_WORKSPACE/output/cycle11-owners/$OWNER.sha256"
          cat "$GITHUB_WORKSPACE/output/cycle11-owners/$OWNER.sha256"
          if test "$OWNER" = recon; then
            # Never approximate/relabel the font: v0.7 Type A face SHA lock.
            python "$GITHUB_WORKSPACE/scripts/install_opengost_type_a.py" \
              --directory "$GITHUB_WORKSPACE/.font-cycle15" \
              --expected-sha256 f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
            PYTHONPATH="$PWD/src:$PWD" python "$GITHUB_WORKSPACE/scripts/export_tl494_23_ink_contract.py" \
              --owner-recon-sha "$OWNER_SHA" \
              --font "$GITHUB_WORKSPACE/.font-cycle15/OpenGOST-TypeA-OpenGOSTtypeA-Regular.ttf" \
              --output "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.json"
            sha256sum "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.json" \
              > "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.sha256"
            cat "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.sha256"
            # Frozen measured source artifact is part of this Draft PR:
            # never silently regenerate a different 23/15/62 ink contract.
            (cd "$GITHUB_WORKSPACE" && sha256sum -c reports/tl494-cycle15-true-23-ink.sha256)
            cmp "$GITHUB_WORKSPACE/reports/tl494-cycle15-true-23-ink.json" \
              "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.json" || {
              # Inspect genuinely divergent physical glyph and Type A text
              # boxes; NEVER convert a failure to a PASS by rounding.
              python - "$GITHUB_WORKSPACE/reports/tl494-cycle15-true-23-ink.json" \
                       "$GITHUB_WORKSPACE/output/cycle11-owners/tl494-23-real-instance-ink.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          
          before, after = (json.loads(Path(p).read_text(encoding="utf-8")) for p in sys.argv[1:])
          def mismatches(expected, actual, at="$"):
              if type(expected) is not type(actual):
                  yield (at, expected, actual)
              elif isinstance(expected, dict):
                  for key in sorted(set(expected) | set(actual)):
                      if key not in expected or key not in actual:
                          yield (at + "." + key, expected.get(key), actual.get(key))
                      else:
                          yield from mismatches(expected[key], actual[key], at + "." + key)
              elif isinstance(expected, list):
                  if len(expected) != len(actual):
                      yield (at + ".length", len(expected), len(actual))
                  for index, (a, b) in enumerate(zip(expected, actual)):
                      yield from mismatches(a, b, f"{at}[{index}]")
              elif expected != actual:
                  yield (at, expected, actual)
          
          for index, (path, expected, actual) in enumerate(mismatches(before, after)):
              if index >= 24:
                  print("UGO_C15_DIFF_MORE_THAN_24; inspect uploaded actual owner JSON")
                  break
              print(f"UGO_C15_EXACT_INK_DIFF {path}: windows={expected!r} linux={actual!r}")
          PY
              echo "::error::UGO_C15_ACTUAL_OWNER_MEASURED_23_INK_DRIFT"
              exit 1
            }
          fi
      - name: Publish real exact HEAD read-only cross-owner geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ygo-cycle11-${{ matrix.owner }}-py${{ matrix.python-version }}-typed-contract
          path: output/cycle11-owners/*
          if-no-files-found: error
