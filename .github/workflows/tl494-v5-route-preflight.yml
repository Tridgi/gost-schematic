name: TL494 V5 true A3 source layout and 15-Net owner route preflight
on:
  push:
    branches: [reference/tl494-audit-v4-20261114]
    paths:
      - examples/tl494_v5/compact_layout.py
      - examples/tl494_v5/route_preflight.py
      - examples/tl494_v5/test_compact_layout.py
      - .github/workflows/tl494-v5-route-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  A3-routing-qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin physical YGO2, ELEKTRIK IC, PAINT and multinet router originals
        run: |
          set -euxo pipefail
          IC=6161e9102cbc0c9e0491fb27ed7a496dc0b274bc
          YGO=779dc0eabbd2d8f2f1ef9289cb683fcab1414bf1
          PAINT=e3ea841dbe087952577121d5690fe41e9a9a5c83
          ROUTER=b3a8263944c5a687492a49555d8149e538f0902b
          for sha in "$IC" "$YGO" "$PAINT" "$ROUTER"; do
            git fetch origin "$sha"
            test "$(git rev-parse FETCH_HEAD)" = "$sha"
          done
          for file in ic.py tl494cn.py ic_pin_alias.py ic_serde.py ic_paint_bridge.py ic_graphic_revision.py; do
            git show "$IC:src/gost_schematic/electrical/$file" > "src/gost_schematic/electrical/$file"
          done
          mkdir -p src/gost_schematic/catalog/source_profiles
          git show "$YGO:src/gost_schematic/catalog/source_profiles.py" > src/gost_schematic/catalog/source_profiles.py
          git show "$YGO:src/gost_schematic/catalog/source_footprints.py" > src/gost_schematic/catalog/source_footprints.py
          git show "$YGO:src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json" > src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json
          for file in ic_rectangular.py ic_hotspots.py ic_orientation.py ic_power_profiles.py ic_tl494_profile.py ic_electrical_binding.py; do
            git show "$PAINT:src/gost_schematic/rendering/$file" > "src/gost_schematic/rendering/$file"
          done
          git show "$ROUTER:src/gost_schematic/validation/route_drc.py" > src/gost_schematic/validation/route_drc.py
          for file in orthogonal_route_planner.py multiterminal_router.py; do
            git show "$ROUTER:src/gost_schematic/engines/$file" > "src/gost_schematic/engines/$file"
          done
      - name: Install exact tooling and genuine font in isolated workflow
        run: |
          set -euxo pipefail
          python -m pip install -e ".[dev,mcp]"
          python scripts/install_opengost_type_a.py --directory "$HOME/.local/share/fonts"
          fc-cache -f
          FONT="$(find "$HOME/.local/share/fonts" -name '*TypeA*.ttf' | head -1)"
          test -n "$FONT"
          echo "TL494_TYPE_A_FONT=$FONT" >> "$GITHUB_ENV"
      - name: Source-preserving A3 placement model and negative tests
        run: |
          set -euxo pipefail
          ruff check examples/tl494_v5/
          PYTHONPATH=src python -m pytest -q examples/tl494_v5/test_native_circuit.py examples/tl494_v5/test_compact_layout.py
      - name: Actual 15-Net multi-terminal router source preflight
        run: |
          set -euxo pipefail
          mkdir -p output/tl494-v5-route
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          import os

          from examples.tl494_v5.route_preflight import audit_source_route
          file = Path("output/tl494-v5-route/a3-real-router-report.json")
          report = audit_source_route(
              Path(os.environ["TL494_TYPE_A_FONT"]), file,
              node_cap=25000,
          )
          assert report["source_sha"] == "e695c415fdced164b0e0c39c5249d030795a0aa6"
          assert report["source_net_count"] == report["origin_net_count"] == 15
          assert report["origin_component_count"] == 23
          assert report["DA1_real_anchor_count"] == 16
          assert report["a3_print_fit"] and report["source_label_layout_valid"]
          assert report["compact_A3"]["nominal_symbols_scaled"] is False
          assert report["compact_A3"]["component_count"] == 23
          assert report["compact_A3"]["width_mm"] <= 400
          assert report["compact_A3"]["height_mm"] <= 277
          assert report["net_diff"] == {
              "added": [], "removed": [], "modified_physical_PinRef": []
          }
          assert report["old_source_negative_drc"] == {
              "errors": 9, "warnings": 32,
              "segments": 91, "junctions": 37,
          }
          assert report["print_after_released"] is False
          if not report["technical_route_eligible"]:
              assert report["incomplete_nets"] or report["drc"]["error_count"] > 0 or report["diagnostics"]
          print(json.dumps({
              "source": report["source_sha"],
              "A3_occupancy": report["compact_A3"],
              "routed_net_count": report["routed_net_count"],
              "incomplete_nets": report["incomplete_nets"],
              "new_DRC_errors": report["drc"]["error_count"],
              "old_negative_errors_preserved": 9,
              "print_release": report["print_after_released"],
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tl494-v5-A3-route-preflight-${{ matrix.python-version }}
          path: output/tl494-v5-route/*.json
          if-no-files-found: warn
