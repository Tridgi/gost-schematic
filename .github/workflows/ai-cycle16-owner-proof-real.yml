name: AI Cycle16 real C15 owner manifest consumer

on:
  pull_request:
    paths:
      - "src/gost_schematic/agent_project/cycle16_owner_proof.py"
      - "examples/agent_tl494_cycle16_owner_proof.py"
      - "examples/agent_tl494_cycle13_quickstart.py"
      - "tests/agent_project/test_cycle16_owner_proof.py"
      - ".github/workflows/ai-cycle16-owner-proof-real.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-c15-wheel-consumer:
    name: Frozen C15 owner route / actual SVG / installed wheel (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Separate exact sources: NO merge, no PR branch changes. C15 manifest's
      # OWNER_SHAS matches the same frozen producer snapshots below.
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _owner_original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 77c588a81529de574ddcdc012bb6b616b8195a1d
          path: _owner_recon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617
          path: _owner_ic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 252fed9077351493378348f4c0a0138c5e04c8b5
          path: _owner_paint
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: d6f8a3a6c54ceaca42111e6534dbc99e72b09a65
          path: _owner_ygo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: b2a7a46c2f031dd125dd0879c9d59d24e27decbf
          path: _owner_net
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build immutable MCP PR wheel BEFORE overlay of external owner code
        run: |
          python -m pip install -e ".[dev,mcp]"
          mkdir -p dist output
          python -m pip wheel . --no-deps --wheel-dir dist
          python scripts/verify_wheel_payload.py dist
          python -m pytest -q tests/agent_project/test_cycle16_owner_proof.py
          python -m ruff check src/gost_schematic/agent_project/cycle16_owner_proof.py \
            examples/agent_tl494_cycle16_owner_proof.py \
            tests/agent_project/test_cycle16_owner_proof.py
      - name: Compose genuine frozen-source C15 owners without committing their files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _owner_original rev-parse HEAD)" = e695c415fdced164b0e0c39c5249d030795a0aa6
          test "$(git -C _owner_recon rev-parse HEAD)" = 77c588a81529de574ddcdc012bb6b616b8195a1d
          test "$(git -C _owner_ic rev-parse HEAD)" = 632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617
          test "$(git -C _owner_paint rev-parse HEAD)" = 252fed9077351493378348f4c0a0138c5e04c8b5
          test "$(git -C _owner_ygo rev-parse HEAD)" = d6f8a3a6c54ceaca42111e6534dbc99e72b09a65
          test "$(git -C _owner_net rev-parse HEAD)" = b2a7a46c2f031dd125dd0879c9d59d24e27decbf
          for name in tl494_native_rework tl494_connected_native tl494_full_native_model tl494_ic_paint_reference tl494_named_photo_sheet; do
            cp "_owner_original/examples/${name}.py" "examples/${name}.py"
          done
          cp -a _owner_recon/examples/tl494_v4 examples/
          cp -a _owner_recon/examples/tl494_v5 examples/
          cp _owner_recon/examples/tl494_ic_paint_reference.py examples/
          cp _owner_recon/examples/tl494_named_photo_sheet.py examples/
          for name in contacts ic ic_agent_snapshot ic_circuit_adapter ic_editor_targets ic_power_presentation tl494cn ic_pin_alias ic_serde ic_paint_bridge ic_graphic_revision; do
            cp "_owner_ic/src/gost_schematic/electrical/${name}.py" src/gost_schematic/electrical/
          done
          cp _owner_ic/tests/fixtures/tl494_photo_23_frozen_cycle9.json tests/fixtures/
          test "$(git hash-object tests/fixtures/tl494_photo_23_frozen_cycle9.json)" = a5c116d8745fadbc14d8f6869e1e7b0f97ff6d65
          mkdir -p src/gost_schematic/catalog/source_profiles
          for name in source_profiles source_footprints; do
            cp "_owner_ygo/src/gost_schematic/catalog/${name}.py" src/gost_schematic/catalog/
          done
          cp _owner_ygo/src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json src/gost_schematic/catalog/source_profiles/
          for name in ic_rectangular ic_hotspots ic_orientation ic_power_profiles ic_tl494_profile ic_electrical_binding ic_sheet_composition external_wire_sheet sheet_svg native_sheet_ink_audit routed_native_sheet; do
            cp "_owner_paint/src/gost_schematic/rendering/${name}.py" src/gost_schematic/rendering/
          done
          for name in orthogonal_route_planner multiterminal_router; do
            cp "_owner_net/src/gost_schematic/engines/${name}.py" src/gost_schematic/engines/
          done
          cp _owner_net/src/gost_schematic/validation/route_drc.py src/gost_schematic/validation/
          cp _owner_net/examples/review_tl494_compact_cycle9.py examples/
          python -m compileall -q examples/tl494_v5/ src/gost_schematic/engines/
      - name: Install exact pinned Type A and run real 23/15/62 owner C15 route
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_opengost_type_a.py \
            --directory "$RUNNER_TEMP/c16-font"
          FONT="$(find "$RUNNER_TEMP/c16-font" -name '*TypeA*' -type f -print -quit)"
          test "$(sha256sum "$FONT" | cut -d ' ' -f 1)" = f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
          python -m examples.tl494_v5.cycle15_delivery \
            --font-file "$FONT" \
            --output output/cycle16-genuine-c15-owner \
            --page-format A3 --node-cap 4000 \
            --priority-trials 1 --priority-offset 3 \
            --physical-veto-restarts 1 --physical-ripup-attempts 2 \
            > output/cycle16-real-c15-summary.json
          test -f output/cycle16-genuine-c15-owner/C15_REAL_TL494_DELIVERY.json
      - name: Real C15 consumer from independent NONEDITABLE MCP wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/gse-c16-installed"
          PY="$RUNNER_TEMP/gse-c16-installed/bin/python"
          WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'gost_schematic-*.whl' -print -quit)"
          "$PY" -m pip install "${WHEEL}[mcp]"
          cd "$RUNNER_TEMP"
          "$PY" -m examples.agent_tl494_cycle16_owner_proof \
            --owner-c15-dir "$GITHUB_WORKSPACE/output/cycle16-genuine-c15-owner" \
            --out "$GITHUB_WORKSPACE/output/cycle16-real-owner-reviewed" \
            > "$GITHUB_WORKSPACE/output/cycle16-real-consumer-stdout.json"
          "$PY" -m examples.agent_tl494_cycle13_quickstart \
            --owner-c15-dir "$GITHUB_WORKSPACE/output/cycle16-genuine-c15-owner" \
            --out "$GITHUB_WORKSPACE/output/cycle16-one-command-wheel-user" \
            > "$GITHUB_WORKSPACE/output/cycle16-real-quickstart-stdout.json"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "output"
          source = json.loads((root / "cycle16-real-owner-reviewed" /
                               "source-c16-owner-candidate-proof.json").read_text())
          user = json.loads((root / "cycle16-one-command-wheel-user" /
                             "source-quickstart-report.json").read_text())
          assert source["source_snapshot"]["components"] == 23
          assert source["source_snapshot"]["original_nets"] == 15
          assert source["source_snapshot"]["physical_pinrefs"] == 62
          assert source["routed_nets"] < 15
          assert source["status"] == "BLOCKED_PARTIAL"
          assert not source["qa_gate"]["print_ready"]
          assert not source["mcp_write_tools_enabled"]
          assert user["external_c15_owner_proof_status"] == source["status"]
          assert user["external_c15_completed_original_nets"] == source["routed_nets"]
          assert user["actual_native_mcp_client_session"] is True
          assert user["refusal_tests_passed"] == 11
          assert not user["mcp_write_tool_enabled"]
          print("C16 real C15 owner proof: complete original Nets",
                source["routed_nets"], "/15; still BLOCKED_PARTIAL")
          PY
      - name: Render real owner PARTIAL SVG preview to diagnostic 300 DPI PNG
        if: success()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for view in clean diagnostic; do
            SRC="output/cycle16-genuine-c15-owner/TL494-A3-${view}-source-b.svg"
            DST="output/cycle16-genuine-c15-owner/TL494-A3-${view}-DRAFT-partial-300dpi.png"
            rsvg-convert --background-color white --dpi-x 300 --dpi-y 300 \
              --output "$DST" "$SRC"
          done
      - name: Hash all actual source/route/SVG/PNG/JSON artifacts
        if: always()
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          paths = sorted(
              p for p in Path("output").rglob("*")
              if p.is_file() and p.suffix.lower() in (".json", ".svg", ".png")
          )
          Path("output/cycle16-real-owner-sha256sum.txt").write_text(
              "".join(f"{sha256(p.read_bytes()).hexdigest()}  {p}\n" for p in paths),
              encoding="utf-8",
          )
          print("Written exact SHA256 for", len(paths), "real files")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c16-real-recon-owner-source-and-wheel-consumer-py312
          path: |
            output/cycle16-genuine-c15-owner/
            output/cycle16-real-c15-summary.json
            output/cycle16-real-owner-reviewed/
            output/cycle16-one-command-wheel-user/
            output/cycle16-real-consumer-stdout.json
            output/cycle16-real-quickstart-stdout.json
            output/cycle16-real-owner-sha256sum.txt
          if-no-files-found: warn
