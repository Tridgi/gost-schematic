name: AI TL494 source-pinned catalog and preflight MCP

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "skills/gost-schematic/SKILL.md"
      - "src/gost_schematic/agent_project/design_assistant.py"
      - "src/gost_schematic/agent_project/agent_readiness.py"
      - "src/gost_schematic/agent_project/owner_source_contract.py"
      - "src/gost_schematic/agent_project/data/tl494_ic97_frozen_source.json"
      - "pyproject.toml"
      - "scripts/verify_wheel_payload.py"
      - "src/gost_schematic/agent_project/service.py"
      - "src/gost_schematic/mcp_server/saved_projects.py"
      - "tests/agent_project/test_tl494_catalog_preflight*.py"
      - "tests/agent_project/test_tl494_ai_selection_cycle9.py"
      - "tests/agent_project/test_agent_readiness_cli.py"
      - "tests/agent_project/test_tl494_owner_contract_cycle11.py"
      - "tests/agent_project/test_tl494_owner_pipeline_cycle11.py"
      - "tests/fixtures/ai_tl494_ic97_pinned_source.json"
      - "tests/agent_project/test_agent_guidance_contract.py"
      - "examples/agent_tl494_catalog_preflight_mcp.py"
      - "examples/agent_readiness_readonly.py"
      - "examples/agent_tl494_cycle11_pipeline.py"
      - "docs/ai-integration/tl494-catalog-and-preflight-issue107.md"
      - "docs/ai-integration/agent-readiness-cli-v01.md"
      - "docs/ai-integration/agent-cycle11-source-driven-walkthrough.md"
      - ".github/workflows/ai-tl494-catalog-preflight.yml"
  workflow_dispatch:

jobs:
  actual-readonly-mcp:
    name: Real catalog MCP + TL494 print preflight (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual source catalog and real MCP transport
        run: python -m pip install -e ".[dev,mcp]"
      - name: Ruff
        run: python -m ruff check .
      - name: Actual stdio ClientSession and engineering unit tests
        run: |
          python -m pytest -q \
            tests/agent_project/test_tl494_catalog_preflight.py \
            tests/agent_project/test_tl494_catalog_preflight_stdio.py \
            tests/agent_project/test_tl494_ai_selection_cycle9.py \
            tests/agent_project/test_agent_readiness_cli.py \
            tests/agent_project/test_agent_guidance_contract.py \
            tests/agent_project/test_tl494_owner_contract_cycle11.py \
            tests/agent_project/test_tl494_owner_pipeline_cycle11.py \
            tests/agent_project/test_mcp_saved_stdio.py
      - name: Real native MCP sample gallery and six-part print preflight
        shell: bash
        run: |
          mkdir -p output
          python -m examples.agent_tl494_catalog_preflight_mcp \
            --workspace output/tl494-catalog-evidence \
            --project-id "24d49302-621b-46a6-9505-8af5be248ab8" \
            --idempotency-key "c623dd5a-a14a-4a1a-a85b-2cead3c86f63" \
            > output/tl494-catalog-client-proof.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          report = json.loads(Path("output/tl494-catalog-client-proof.json").read_text())
          assert report["transport"] == "real stdio MCP ClientSession"
          assert report["codex_cli_used"] is False
          assert report["python_bootstrap_not_mcp_write"] is True
          assert report["source_locked_reference_count"] == 13
          assert report["catalog_selection_all_parts_SHA_verified"] is True
          assert report["placement_proposal"]["commit_authorized"] is False
          assert report["placement_proposal"]["model_or_head_mutated"] is False
          assert any(d["code"] == "CONNECTED_PIN_RELOCATION_BLOCKED"
                     for d in report["placement_proposal"]["diagnostics"])
          assert len(report["tl494_profile"]["required_variants"]) == 13
          assert report["tl494_profile"]["frozen_source_git_commit_sha"] == (
              "e695c415fdced164b0e0c39c5249d030795a0aa6"
          )
          assert report["selected_physical_symbol_variants"]["resistor.variable"][
              "physical_pin_count"
          ] == 3
          assert report["tl494_profile"]["tl494_device_catalog"] == "NOT_IN_INSTALLED_P11_CATALOG"
          assert report["tl494_aliases"]["FEEDBACK"]["display_alias"] == "FB"
          assert report["tl494_aliases"]["OUTPUT CTRL"]["display_alias"] == "OC"
          assert report["saved_sixpart_preflight"]["print_ready"] is False
          assert report["misprofiled_sixpart_tl494_preflight"]["print_ready"] is False
          refs = {d["code"] for d in
                  report["misprofiled_sixpart_tl494_preflight"]["diagnostics"]}
          assert "TL494_UGO_VARIANT_MISMATCH" in refs
          assert "TL494_REQUIRED_COMPONENT_MISSING" in refs
          for part, hashes in report["selected_physical_symbol_variants"].items():
              for ext in ("svg", "png"):
                  path = Path("output/tl494-catalog-evidence/client-evidence") / (part+"."+ext)
                  assert path.is_file()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == hashes[ext+"_sha256"]
          for ext in ("svg", "png"):
              path = Path("output/tl494-catalog-evidence/client-evidence") / (
                  "saved-c3-diagnostic."+ext
              )
              assert path.exists()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == report[
                  "project_diagnostic_"+ext+"_sha256"
              ]
          print("MCP project SHA:", report["project_revision"])
          print("Source-locked variants:", sorted(report["selected_physical_symbol_variants"]))
          PY
      - name: Real typed AI CLI physical Net/Pins and fail-closed evidence
        shell: bash
        run: |
          python -m examples.agent_readiness_readonly \
            --workspace output/agent-readiness             > output/agent-readiness-proof.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path("output/agent-readiness-proof.json").read_text())
          assert report["generator_implemented"] is False
          assert report["mcp_write_tools_enabled"] is False
          assert report["project_model_unchanged"] is True
          assert report["accepted_review"]["status"] == "READ_ONLY_MODEL_MATCH"
          assert report["accepted_review"]["ready_to_generate"] is False
          assert report["accepted_review"]["component_count"] == 6
          assert report["accepted_review"]["net_count"] == 5
          assert report["incomplete_net_denial"]["code"] == "REQUEST_NET_MEMBERSHIP_MISMATCH"
          assert report["malicious_write_intent_denial"]["code"] == "REQUEST_INTENT_UNSUPPORTED"
          assert report["unauthorized_project_denial"]["code"] == "PROJECT_ACCESS_DENIED"
          assert report["exit_statuses"] == [0, 3, 3, 3]
          assert len(report["project_revision"]) == 64
          evidence = Path("output/agent-readiness/readiness-client-evidence/proof.json")
          assert evidence.is_file()
          assert json.loads(evidence.read_text()) == report
          snapshot = Path("output/agent-readiness/projects") / (
              "d3597e28-c8d8-46f6-8473-a0d03b520c9a"
          )
          head = snapshot / "HEAD.json"
          blob = snapshot / "revisions" / (report["project_revision"] + ".gseproj")
          assert hashlib.sha256(head.read_bytes()).hexdigest() == report[
              "project_head_sha256"
          ]
          assert hashlib.sha256(blob.read_bytes()).hexdigest() == report[
              "project_blob_sha256"
          ]
          print("Typed review/no write project SHA:", report["project_revision"])
          PY
      - name: Pin actual IC97 and RECON115 owner HEAD source, never execute owner Python
        shell: bash
        run: |
          mkdir -p output/cycle11-owner
          git fetch --no-tags --depth=1 origin \
            1e4baf7ea713f649e0dabb4d6119e97281901f03 \
            c58e224700b318892ee92197f8bfd391807a7325
          git show 1e4baf7ea713f649e0dabb4d6119e97281901f03:tests/fixtures/tl494_photo_23_frozen_cycle9.json \
            > output/cycle11-owner/frozen-IC97-source.json
          git show 1e4baf7ea713f649e0dabb4d6119e97281901f03:src/gost_schematic/electrical/tl494cn.py \
            > output/cycle11-owner/IC97-tl494cn.py
          git show c58e224700b318892ee92197f8bfd391807a7325:examples/tl494_v5/native_circuit.py \
            > output/cycle11-owner/RECON115-native-circuit.py
          test "$(git hash-object output/cycle11-owner/frozen-IC97-source.json)" = \
            "a5c116d8745fadbc14d8f6869e1e7b0f97ff6d65"
          test "$(git hash-object src/gost_schematic/agent_project/data/tl494_ic97_frozen_source.json)" = \
            "a5c116d8745fadbc14d8f6869e1e7b0f97ff6d65"
      - name: Real full 23/15/62 source → native MCP choices → strictly BLOCKED typed pipeline
        shell: bash
        run: |
          python -m examples.agent_tl494_cycle11_pipeline \
            --owner-fixture output/cycle11-owner/frozen-IC97-source.json \
            --ic-header output/cycle11-owner/IC97-tl494cn.py \
            --recon-header output/cycle11-owner/RECON115-native-circuit.py \
            --out output/cycle11-original-source-proof \
            > output/cycle11-source-pipeline-report.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          proof = json.loads(Path("output/cycle11-source-pipeline-report.json").read_text())
          assert proof["status"] == "BLOCKED_15NET_NOT_ROUTED"
          assert proof["real_source_23_15_62_verified"] is True
          assert proof["source_components_count"] == 23
          assert proof["source_nets_count"] == 15
          assert proof["source_pinrefs_count"] == 62
          assert proof["da1_16_contacts"] is True
          assert proof["typed_readiness"]["status"] == "BLOCKED_SOURCE_NOT_IMPORTABLE"
          assert proof["typed_readiness"]["frozen_original_pinref_membership_verified"]
          assert proof["typed_readiness_exit"] == 2
          assert proof["missing_net_reject_code"] == "SOURCE_NET_INVENTORY_INCOMPLETE"
          assert proof["missing_net_reject_exit"] == 3
          assert proof["owner_part_id_bridge"]["reversible"]
          assert proof["reversible_net_display"][
              "reversible_to_original_physical_15_net_memberships"
          ]
          assert not proof["print_ready"] and not proof["new_print_svg_generated"]
          assert not proof["new_print_png300dpi_generated"]
          assert proof["route_completed_nets"] == 0 and not proof["route_tool_called"]
          assert not proof["mcp_write_tool_enabled"] and not proof["autonomous_codex_model_run"]
          assert len(proof["real_UGO_samples"]) == 7
          for part, source in proof["real_UGO_samples"].items():
              for ext in ("svg", "png"):
                  raw = (Path("output/cycle11-original-source-proof") / (
                      part + "." + ext
                  )).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == source[
                      "real_" + ext + "_sha256"
                  ]
          assert json.loads(Path(
              "output/cycle11-original-source-proof/source-pipeline-report.json"
          ).read_text()) == proof
          print("Authentic original physical source Git blob:", proof[
              "source_fixture_git_blob_sha1"
          ])
          print("Immutable original typed manifest SHA:", proof[
              "source_typed_manifest_sha256"
          ])
          print("15/15 route: BLOCKED, no image-only success")
          PY
      - name: Build wheel and verify package payload
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python scripts/verify_wheel_payload.py dist
      - name: Archive actual UGO glyphs and project diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ai-tl494-catalog-evidence-python-${{ matrix.python }}
          path: |
            output/tl494-catalog-client-proof.json
            output/tl494-catalog-evidence/client-evidence/
            output/tl494-catalog-evidence/projects/
            output/agent-readiness-proof.json
            output/agent-readiness/readiness-client-evidence/
            output/agent-readiness/projects/
            output/cycle11-owner/
            output/cycle11-source-pipeline-report.json
            output/cycle11-original-source-proof/
          if-no-files-found: error
          retention-days: 30
