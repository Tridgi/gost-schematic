name: TL494 full 23-part native typed source audit

on:
  push:
    branches:
      - reference/tl494-native-rework-20261114
    paths:
      - examples/tl494_full_native_model.py
      - .github/workflows/tl494-full-typed-netlist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  circuit-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run genuine Circuit/Net/PinRef contract and model diagnostics
        id: model
        continue-on-error: true
        run: |
          set +e
          mkdir -p examples/tl494_model_output
          PYTHONPATH=src python -m examples.tl494_full_native_model \
            > examples/tl494_model_output/model_build_log.txt 2>&1
          CODE=$?
          echo "TYPED_MODEL_EXIT_CODE=$CODE" >> examples/tl494_model_output/model_build_log.txt
          cat examples/tl494_model_output/model_build_log.txt
          if [ "$CODE" -ne 0 ]; then exit 1; fi
      - name: Persist evidence and errors in the isolated reference branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f examples/tl494_model_output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(reference): store native 23-part TL494 model audit"
          git fetch origin reference/tl494-native-rework-20261114
          git rebase FETCH_HEAD
          git push origin HEAD:reference/tl494-native-rework-20261114
