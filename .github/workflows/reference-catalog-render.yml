name: Native catalog reference renders
on:
  push:
    branches: ["catalog/resistor-reference-batch01"]
  pull_request:
    paths:
      - "src/gost_schematic/catalog/**"
      - "examples/review_resistor_batch*.py"
      - "examples/review_categorized_catalog.py"
      - "examples/review_bipolar_layouts.py"
      - "examples/review_mosfet_layouts.py"
      - "tests/test_mosfet_layouts.py"
      - "tests/test_mosfet_extended_layouts.py"
      - "tests/test_mosfet_body_diode.py"
      - "examples/review_transistor_switches.py"
      - "tests/test_transistor_switches.py"
      - "tests/test_transistor_profile_persistence.py"
      - "tests/test_transistor_v2_projection.py"
      - "ui/integration/transistor_catalog.py"
      - "src/gost_schematic/agent_project/catalog.py"
      - "tests/test_bipolar_layouts.py"
      - "tests/test_categorized_catalog.py"
      - ".github/workflows/reference-catalog-render.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mcp]" jsonschema==4.26.0
      - name: Render actual installed catalog
        run: |
          python examples/review_resistor_batch01.py
          python examples/review_resistor_batch02.py
          python examples/review_full_catalog_native.py
          python examples/review_categorized_catalog.py
          python examples/review_bipolar_layouts.py
          python examples/review_mosfet_layouts.py
          python examples/review_transistor_switches.py
          python scripts/audit_routing_protection.py
      - name: Rasterize native galleries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for gallery in output/resistor-batch*/gallery-*.svg output/full-catalog-native/catalog-*.svg output/catalog-categorized/*/*.svg output/bipolar-layouts/*.svg output/mosfet-layouts/*/*.svg output/transistor-switches/*/*.svg; do
            rsvg-convert --background-color white --width 2400 -o "${gallery%.svg}.png" "$gallery"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-reference-catalog-svg-png
          path: |
            output/resistor-batch*/
            output/full-catalog-native/
            output/catalog-categorized/
            output/bipolar-layouts/
            output/mosfet-layouts/
            output/transistor-switches/
          if-no-files-found: error
      - name: Check catalog structural integrity and focused regressions
        run: |
          python scripts/audit_symbol_catalog.py --output output/catalog-integrity-audit.json
          pytest -q tests/test_resistor_batch01.py tests/test_resistor_batch02.py tests/test_full_catalog_native.py tests/test_protective_routing_keepout.py tests/test_inductor_extended_profile.py tests/test_transformer_family.py tests/test_measurement_transformers.py tests/test_three_phase_magnetic.py tests/test_magnetic_amplifier_family.py tests/test_magnetic_supplement.py tests/test_transductor_family.py tests/test_categorized_catalog.py tests/test_magnetic_remaining_r5.py tests/test_routing_protection_audit.py tests/test_transistor_protection_r6.py tests/test_magnetic_source_review_r6.py tests/test_diode_cycle4.py tests/test_diode_cycle4_svg.py tests/test_diode_cycle4_transformed_svg.py tests/test_catalog_cycle7_semiconductors.py tests/test_semiconductor_s2.py tests/test_thyristor_s3.py tests/test_bipolar_layouts.py tests/test_mosfet_layouts.py tests/test_mosfet_extended_layouts.py tests/test_mosfet_body_diode.py tests/test_transistor_switches.py tests/test_transistor_profile_persistence.py tests/test_transistor_v2_projection.py
