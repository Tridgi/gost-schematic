name: QA Cycle16 real RECON C15 23-15-62 source release refusal
on:
  push:
    branches: [parallel/qa-electronic-cycle7]
    paths:
      - scripts/qa_cycle16_source_release_gate.py
      - .github/workflows/qa-cycle16-source-release.yml
  pull_request:
    branches: [integration/stage0-12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-owner-negative-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      ORIGINAL_SHA: e695c415fdced164b0e0c39c5249d030795a0aa6
      RECON_SHA: 77c588a81529de574ddcdc012bb6b616b8195a1d
      IC_SHA: 632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617
      PAINT_SHA: 252fed9077351493378348f4c0a0138c5e04c8b5
      YGO_SHA: d6f8a3a6c54ceaca42111e6534dbc99e72b09a65
      NET_SHA: b2a7a46c2f031dd125dd0879c9d59d24e27decbf
      FONT_SHA: f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
    steps:
      - name: Our existing QA Draft, source read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _c16_source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 77c588a81529de574ddcdc012bb6b616b8195a1d
          path: _c16_recon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 632d5cf4222f188a65d0ec4a6ed22d8dcf1c8617
          path: _c16_ic
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 252fed9077351493378348f4c0a0138c5e04c8b5
          path: _c16_paint
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: d6f8a3a6c54ceaca42111e6534dbc99e72b09a65
          path: _c16_ygo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: b2a7a46c2f031dd125dd0879c9d59d24e27decbf
          path: _c16_net
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Strictly check all exact source owner immutable Git HEADs
        run: |
          set -euo pipefail
          for row in "_c16_source:$ORIGINAL_SHA" "_c16_recon:$RECON_SHA" "_c16_ic:$IC_SHA" "_c16_paint:$PAINT_SHA" "_c16_ygo:$YGO_SHA" "_c16_net:$NET_SHA"; do
            folder="${row%%:*}"; expected="${row##*:}"
            test "$(git -C "$folder" rev-parse HEAD)" = "$expected"
          done
      - name: Stage REAL original IC/PAINT/YGO/NET into disposable RECON checkout
        run: |
          set -euo pipefail
          cd _c16_recon
          for f in ic.py tl494cn.py ic_pin_alias.py ic_serde.py ic_paint_bridge.py ic_graphic_revision.py ic_circuit_adapter.py ic_editor_targets.py; do
            cp "../_c16_ic/src/gost_schematic/electrical/$f" "src/gost_schematic/electrical/$f"
          done
          cp ../_c16_ic/examples/tl494_cycle9_circuit_integration.py examples/
          mkdir -p tests/fixtures
          cp ../_c16_ic/tests/fixtures/tl494_photo_23_frozen_cycle9.json tests/fixtures/
          test "$(git hash-object tests/fixtures/tl494_photo_23_frozen_cycle9.json)" = a5c116d8745fadbc14d8f6869e1e7b0f97ff6d65
          for f in ic_rectangular.py ic_hotspots.py ic_orientation.py ic_power_profiles.py ic_tl494_profile.py ic_electrical_binding.py ic_sheet_composition.py external_wire_sheet.py sheet_svg.py native_sheet_ink_audit.py routed_native_sheet.py; do
            cp "../_c16_paint/src/gost_schematic/rendering/$f" "src/gost_schematic/rendering/$f"
          done
          mkdir -p src/gost_schematic/catalog/source_profiles
          cp ../_c16_ygo/src/gost_schematic/catalog/source_profiles.py src/gost_schematic/catalog/
          cp ../_c16_ygo/src/gost_schematic/catalog/source_footprints.py src/gost_schematic/catalog/
          cp ../_c16_ygo/src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json src/gost_schematic/catalog/source_profiles/
          cp ../_c16_ygo/scripts/install_opengost_type_a.py scripts/
          for f in orthogonal_route_planner.py multiterminal_router.py; do
            cp "../_c16_net/src/gost_schematic/engines/$f" src/gost_schematic/engines/
          done
          cp ../_c16_net/src/gost_schematic/validation/route_drc.py src/gost_schematic/validation/
          cp ../_c16_net/examples/review_tl494_compact_cycle9.py examples/
      - name: Build true current source and verified Type A font
        run: |
          set -euo pipefail
          python -m pip install -e "./_c16_recon[dev,mcp,fonts]"
          python -m ruff check scripts/qa_cycle16_source_release_gate.py
          python _c16_recon/scripts/install_opengost_type_a.py --directory "$HOME/.local/share/fonts"
          fc-cache -f
          FONT="$(find "$HOME/.local/share/fonts" -name '*TypeA*.ttf' -type f -print -quit)"
          test -n "$FONT"
          test "$(sha256sum "$FONT" | awk '{print $1}')" = "$FONT_SHA"
          echo "QA_C16_TYPE_A=$FONT" >> "$GITHUB_ENV"
      - name: Produce REAL independent original 15-Net source witness
        run: |
          set -euo pipefail
          cd _c16_recon
          mkdir -p output/qa-c16-source-witness
          PYTHONPATH=src:. python -m examples.tl494_v5.cycle11_binding_preflight \
            --font-file "$QA_C16_TYPE_A" \
            --output-file output/qa-c16-source-witness/E695-C11-SIGNED.json
          test -s output/qa-c16-source-witness/E695-C11-SIGNED.json
      - name: One genuine RECON+NET+PAINT C15 owner A3 9/15 candidate, no fake PASS
        run: |
          set -euo pipefail
          cd _c16_recon
          PYTHONPATH=src:. python -m examples.tl494_v5.cycle15_delivery \
            --font-file "$QA_C16_TYPE_A" \
            --output output/qa-c16-delivery --node-cap 4000 \
            --priority-trials 1 --priority-offset 3 \
            --physical-veto-restarts 1 --physical-ripup-attempts 2 \
            --move C1:0:2.5
          test -s output/qa-c16-delivery/C15_REAL_TL494_DELIVERY.json
      - name: Strict release refuses the TRUE partial without treating any forgery as expected
        run: |
          set -euo pipefail
          WIT=_c16_recon/output/qa-c16-source-witness/E695-C11-SIGNED.json
          SOURCE_HASH="$(sha256sum "$WIT" | awk '{print $1}')"
          MANIFEST=_c16_recon/output/qa-c16-delivery/C15_REAL_TL494_DELIVERY.json
          python scripts/qa_cycle16_source_release_gate.py \
            --manifest "$MANIFEST" --source-witness "$WIT" \
            --source-witness-sha256 "$SOURCE_HASH" \
            --font-file "$QA_C16_TYPE_A" --expect-blocked \
            --output output/qa-c16-source-release-negative-${{ matrix.python-version }}.json
          set +e
          python scripts/qa_cycle16_source_release_gate.py \
            --manifest "$MANIFEST" --source-witness "$WIT" \
            --source-witness-sha256 "$SOURCE_HASH" \
            --font-file "$QA_C16_TYPE_A" \
            --output output/qa-c16-must-not-release-${{ matrix.python-version }}.json \
            > output/c16-strict-rejection-${{ matrix.python-version }}.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q QA_C16_NO_GO_INCOMPLETE_ output/c16-strict-rejection-${{ matrix.python-version }}.log
          test ! -f output/qa-c16-must-not-release-${{ matrix.python-version }}.json
      - name: Upload actual pinned artifacts and truthful FAIL-CLOSED report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-c16-original-C15-source-and-rejected-release-${{ matrix.python-version }}
          path: |
            _c16_recon/output/qa-c16-source-witness/
            _c16_recon/output/qa-c16-delivery/
            output/qa-c16-source-release-negative-${{ matrix.python-version }}.json
            output/c16-strict-rejection-${{ matrix.python-version }}.log
          if-no-files-found: warn
