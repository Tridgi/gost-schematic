name: QA92 Next sprint independent 15-Net route and current-owner physical contract

on:
  push:
    branches: ["parallel/qa-electronic-cycle7"]
  pull_request:
    branches: ["integration/stage0-12"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-physical-negative-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout QA only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact unmodified historically known-bad source
        uses: actions/checkout@v4
        with:
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _qa_sources/original
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual native source model and strict QA linters
        run: python -m pip install -e "./_qa_sources/original[dev]"
      - name: Ruff both QA contracts without silencing tests
        run: |
          ruff check scripts/qa_tl494_router_contract.py scripts/qa_tl494_next_route_gate.py
      - name: Run historical 23/15/62 physical source backed mutation negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _qa_sources/original rev-parse HEAD)" = e695c415fdced164b0e0c39c5249d030795a0aa6
          cp scripts/qa_tl494_router_contract.py scripts/qa_tl494_next_route_gate.py scripts/qa_tl494_cycle10_candidate_gate.py _qa_sources/original/scripts/
          mkdir -p output
          cd _qa_sources/original
          PYTHONPATH=src:. python scripts/qa_tl494_next_route_gate.py \
            --frozen-root . \
            --output "../../output/next-route-contract-${{ matrix.python-version }}.json"
      - name: Upload mutation evidence (NO fake print pass)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa92-next-route-contract-py${{ matrix.python-version }}
          path: output/next-route-contract-${{ matrix.python-version }}.json
          if-no-files-found: warn

  actual-typed-23part-router-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable frozen 23/15/91 source
        uses: actions/checkout@v4
        with:
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _qa_sources/original
          persist-credentials: false
      - name: Real full 23-part A3 reference assembly
        uses: actions/checkout@v4
        with:
          ref: 4db3b8bb7b06757602787b48240d0deaaa3dc754
          path: _qa_sources/recon
          persist-credentials: false
      - name: Exact 15-Net physical owner
        uses: actions/checkout@v4
        with:
          ref: b3a8263944c5a687492a49555d8149e538f0902b
          path: _qa_sources/net
          persist-credentials: false
      - name: Real TI TL494 16-pin owner
        uses: actions/checkout@v4
        with:
          ref: b28428d94218cac777a28897ce9176285d0fab0b
          path: _qa_sources/ic
          persist-credentials: false
      - name: Real source-faithful full native PAINT owner
        uses: actions/checkout@v4
        with:
          ref: 161c31bd0b538c6e827341ae465c3b3a59f6637d
          path: _qa_sources/paint
          persist-credentials: false
      - name: Immutable real 13 source UGO choices
        uses: actions/checkout@v4
        with:
          ref: edc71a48035723d48a203ae2ea12588701f68ba8
          path: _qa_sources/catalog
          persist-credentials: false
      - name: SHA attest, overlay only exact verified production sources inside ephemeral CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _qa_sources/original rev-parse HEAD)" = e695c415fdced164b0e0c39c5249d030795a0aa6
          test "$(git -C _qa_sources/recon rev-parse HEAD)" = 4db3b8bb7b06757602787b48240d0deaaa3dc754
          test "$(git -C _qa_sources/net rev-parse HEAD)" = b3a8263944c5a687492a49555d8149e538f0902b
          test "$(git -C _qa_sources/ic rev-parse HEAD)" = b28428d94218cac777a28897ce9176285d0fab0b
          test "$(git -C _qa_sources/paint rev-parse HEAD)" = 161c31bd0b538c6e827341ae465c3b3a59f6637d
          test "$(git -C _qa_sources/catalog rev-parse HEAD)" = edc71a48035723d48a203ae2ea12588701f68ba8
          cp scripts/qa_tl494_router_contract.py scripts/qa_tl494_next_route_gate.py _qa_sources/original/scripts/
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2

          root = Path("_qa_sources/recon")
          def stage(owner, src, dst):
              source = Path("_qa_sources") / owner / src
              target = root / dst
              assert source.is_file(), source
              target.parent.mkdir(parents=True, exist_ok=True)
              copy2(source, target)

          for name in ("ic.py", "tl494cn.py", "ic_pin_alias.py",
                       "ic_serde.py", "ic_paint_bridge.py", "ic_graphic_revision.py"):
              stage("ic", "src/gost_schematic/electrical/" + name,
                    "src/gost_schematic/electrical/" + name)
          stage("ic", "examples/tl494_cycle9_circuit_integration.py",
                "examples/tl494_cycle9_circuit_integration.py")
          stage("ic", "tests/fixtures/tl494_photo_23_frozen_cycle9.json",
                "tests/fixtures/tl494_photo_23_frozen_cycle9.json")
          stage("catalog", "src/gost_schematic/catalog/source_profiles.py",
                "src/gost_schematic/catalog/source_profiles.py")
          stage("catalog", "src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json",
                "src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json")
          for name in ("ic_rectangular.py", "ic_hotspots.py", "ic_orientation.py",
                       "ic_power_profiles.py", "ic_tl494_profile.py", "ic_electrical_binding.py"):
              stage("paint", "src/gost_schematic/rendering/" + name,
                    "src/gost_schematic/rendering/" + name)
          stage("net", "src/gost_schematic/validation/route_drc.py",
                "src/gost_schematic/validation/route_drc.py")
          for name in ("orthogonal_route_planner.py", "multiterminal_router.py"):
              stage("net", "src/gost_schematic/engines/" + name,
                    "src/gost_schematic/engines/" + name)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual reference dependency + true OpenGost
        shell: bash
        run: |
          python -m pip install -e "./_qa_sources/recon[dev,mcp]"
          python _qa_sources/recon/scripts/install_opengost_type_a.py \
            --expected-sha256 f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a \
            --directory "$HOME/.local/share/fonts"
          fc-cache -f
          FONT_FILE="$(find "$HOME/.local/share/fonts" -type f -iname '*TypeA*.ttf' | head -1)"
          test -f "$FONT_FILE"
          echo "QA92_ROUTER_FONT=$FONT_FILE" >> "$GITHUB_ENV"
      - name: Independently compute actual current 23-part 15-Net A3 owner route
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/qa92-next-route-${{ matrix.python-version }}
          cd _qa_sources/recon
          PYTHONPATH=src:. python - <<'PY'
          import os
          import json
          from pathlib import Path
          from examples.tl494_v5.route_preflight import audit_source_route
          out = Path("../../output/qa92-next-route-${{ matrix.python-version }}/owner-actual-route.json")
          report = audit_source_route(Path(os.environ["QA92_ROUTER_FONT"]), out, node_cap=25000)
          assert report["source_sha"] == "e695c415fdced164b0e0c39c5249d030795a0aa6"
          assert report["origin_component_count"] == 23
          assert report["origin_net_count"] == 15
          assert report["DA1_real_anchor_count"] == 16
          print("ACTUAL_OWNER_ROUTER", json.dumps({
              "routed": report["routed_net_count"],
              "source": report["source_net_count"],
              "new_DRC_errors": report["drc"]["error_count"],
              "release": report["print_after_released"],
          }))
          PY
      - name: Drive REAL current RECON candidate over every one of 15 original named a/b Nets
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/recon
          PYTHONPATH=src:. python -m examples.tl494_v5.route_candidate_driver \
            --font-file "$QA92_ROUTER_FONT" \
            --output-file "../../output/qa92-next-route-${{ matrix.python-version }}/owner-recon-all-original-names.json" \
            --variants source --node-cap 25000
      - name: Independent original 23/15/62 source-aware guard against candidate forgery
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/original
          PYTHONPATH=src:. python scripts/qa_tl494_cycle10_candidate_gate.py \
            --frozen-root . \
            --recon-root ../recon \
            --ic-fixture ../ic/tests/fixtures/tl494_photo_23_frozen_cycle9.json \
            --candidate-report "../../output/qa92-next-route-${{ matrix.python-version }}/owner-recon-all-original-names.json" \
            --output "../../output/qa92-next-route-${{ matrix.python-version }}/independent-original-a-b-candidate.json"
      - name: Independent immutable original Circuit checks actual owner A3 report
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/original
          PYTHONPATH=src:. python scripts/qa_tl494_next_route_gate.py \
            --frozen-root . \
            --route-report "../../output/qa92-next-route-${{ matrix.python-version }}/owner-actual-route.json" \
            --output "../../output/qa92-next-route-${{ matrix.python-version }}/qa-independent-matrix.json"
      - name: Upload exact owner route, independent 15-Net gate and all blockers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa92-next-15net-owner-py${{ matrix.python-version }}
          path: output/qa92-next-route-${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 30
