name: Visual CAD R1 source gate
on:
  push:
    branches: [ui/visual-cad-mvp]
    paths: ['ui/editor/**', 'ui/integration/**', 'ui/experiments/r0/**', 'ui/contracts/**', 'ui/editor/src/model/**', 'ui/editor/src/wires/**', 'ui/editor/src/canvas/**', 'ui/fixtures/**', 'ui/qa/chat3-canvas/**', '.github/workflows/visual-cad-r1.yml']
  pull_request:
    paths: ['ui/integration/**', 'ui/experiments/r0/**', 'ui/contracts/**', 'ui/editor/src/model/**', 'ui/editor/src/wires/**', 'ui/editor/src/canvas/**', 'ui/fixtures/**', 'ui/qa/chat3-canvas/**', '.github/workflows/visual-cad-r1.yml']
  workflow_dispatch:
jobs:
  candidate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ui/integration/source-gate.mjs
      - run: node --check ui/integration/source-gate.test.mjs
      - run: node --test ui/integration/source-gate.test.mjs

  r0-editor-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone source
        run: |
          node --check ui/experiments/r0/core.mjs
          node --check ui/experiments/r0/app.mjs
      - name: R0 UI model regression (NOT React/Tauri acceptance)
        run: node --test ui/experiments/r0/tests/core.test.mjs

  source-v2-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned standalone model test requirements
        run: python -m pip install -r ui/editor/src/model/requirements-dev.txt
      - name: Source-locked model, schema and negative fixtures
        env:
          PYTHONPATH: ui/editor/src/model
        run: python -m pytest -q ui/editor/src/model/tests
  manual-wire-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/editor/src/wires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript for standalone wire tests (not production app lock)
        run: npm install --no-audit --no-fund --ignore-scripts --no-save typescript@5.8.3
      - name: Strict TS wire typecheck
        run: npm run typecheck
      - name: Compile standalone wire engine
        run: npm run build
      - name: Manual wire graph positive/negative suite
        run: npm test
  project-wire-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model validator and compile typed wire engine
        run: |
          python -m pip install -r ui/editor/src/model/requirements-dev.txt
          cd ui/editor/src/wires
          npm install --no-audit --no-fund --ignore-scripts --no-save typescript@5.8.3
          npm run typecheck
          npm run build
      - name: Python source model adapter positive and negative tests
        run: python -m unittest discover -s ui/integration -p 'test_project_wire_bridge.py' -v
      - name: Full E695 ProjectV2 through real TypeScript WireEngine and back
        run: node --test ui/integration/project-wire-bridge.test.mjs

  react-mantine-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install canonical fixture validator
        run: python -m pip install -r ui/editor/src/model/requirements-dev.txt
      - name: Install pinned React/Mantine packages and check full frontend
        working-directory: ui/editor
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Verify actual compiled browser app exists
        run: test -s ui/editor/dist/index.html
      - name: Compile signed wire engine for browser test oracle
        working-directory: ui/editor
        run: ./node_modules/.bin/tsc -p src/wires/tsconfig.json
      - name: Install real Chromium and dependencies
        working-directory: ui/editor
        run: npx playwright install --with-deps chromium
      - name: End-to-end real browser physical pin/wire and theme tests
        working-directory: ui/editor
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-cad-r2-chromium
          path: |
            ui/editor/test-results/
            ui/editor/playwright-report/
          if-no-files-found: ignore

  canvas-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static canvas source
        run: |
          node --check ui/editor/src/canvas/precision.mjs
          node --check ui/editor/src/canvas/scene-projection.mjs
          node --check ui/qa/chat3-canvas/oracle.mjs
      - name: Independent signed-geometry and QA oracle
        run: node --test ui/editor/src/canvas/*.test.mjs ui/qa/chat3-canvas/*.test.mjs
