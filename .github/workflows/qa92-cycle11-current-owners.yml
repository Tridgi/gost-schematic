name: QA92 Cycle11 live owner HEADs full source 23-15-62 16-tip independent acceptance

on:
  push:
    branches: [parallel/qa-electronic-cycle7]
  pull_request:
    branches: [integration/stage0-12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-current-owner-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      SOURCE_SHA: e695c415fdced164b0e0c39c5249d030795a0aa6
      RECON_SHA: c58e224700b318892ee92197f8bfd391807a7325
      IC_SHA: 1e4baf7ea713f649e0dabb4d6119e97281901f03
      PAINT_SHA: f69d891e2f17797878627447eb7f05a66f311ca0
      NET_SHA: b5436ecc800bf7c4a99e1d71cce0cb5dc854ed52
      YGO_SHA: eb16121e07efec71de77dfc7b8123bc09f66ddd6
    steps:
      - name: Existing Draft QA branch, never modifying original owner trees
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen immutable E695 source
        uses: actions/checkout@v4
        with:
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _qa_sources/original
          persist-credentials: false
      - name: Current RECON owner code, all 23 components and routed graph export
        uses: actions/checkout@v4
        with:
          ref: c58e224700b318892ee92197f8bfd391807a7325
          path: _qa_sources/recon
          persist-credentials: false
      - name: Current true manufacturer TI #97 model and typed adapter
        uses: actions/checkout@v4
        with:
          ref: 1e4baf7ea713f649e0dabb4d6119e97281901f03
          path: _qa_sources/ic
          persist-credentials: false
      - name: Current PAINT physical IC and routed new full sheet
        uses: actions/checkout@v4
        with:
          ref: f69d891e2f17797878627447eb7f05a66f311ca0
          path: _qa_sources/paint
          persist-credentials: false
      - name: Current NET 15-Net route and strict print DRC
        uses: actions/checkout@v4
        with:
          ref: b5436ecc800bf7c4a99e1d71cce0cb5dc854ed52
          path: _qa_sources/net
          persist-credentials: false
      - name: Current source-figure 36 DRAFT catalog
        uses: actions/checkout@v4
        with:
          ref: eb16121e07efec71de77dfc7b8123bc09f66ddd6
          path: _qa_sources/catalog
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check each ACTUAL checkout SHA, stage only owner code onto disposable RECON worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _qa_sources/original rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C _qa_sources/recon rev-parse HEAD)" = "$RECON_SHA"
          test "$(git -C _qa_sources/ic rev-parse HEAD)" = "$IC_SHA"
          test "$(git -C _qa_sources/paint rev-parse HEAD)" = "$PAINT_SHA"
          test "$(git -C _qa_sources/net rev-parse HEAD)" = "$NET_SHA"
          test "$(git -C _qa_sources/catalog rev-parse HEAD)" = "$YGO_SHA"
          cp scripts/qa_tl494_router_contract.py scripts/qa_tl494_next_route_gate.py \
            scripts/qa_tl494_cycle10_candidate_gate.py _qa_sources/original/scripts/
          cp scripts/qa_tl494_current_editor_cycle10.py _qa_sources/ic/scripts/
          python - <<'PY'
          from pathlib import Path
          from shutil import copy2

          recon = Path("_qa_sources/recon")
          def stage(owner, path):
              origin = Path("_qa_sources") / owner / path
              assert origin.is_file(), (owner, path)
              target = recon / path
              target.parent.mkdir(parents=True, exist_ok=True)
              copy2(origin, target)

          for name in (
              "ic.py", "tl494cn.py", "ic_pin_alias.py",
              "ic_serde.py", "ic_paint_bridge.py", "ic_graphic_revision.py",
              "ic_circuit_adapter.py", "ic_editor_targets.py",
          ):
              stage("ic", "src/gost_schematic/electrical/" + name)
          stage("ic", "examples/tl494_cycle9_circuit_integration.py")
          stage("ic", "tests/fixtures/tl494_photo_23_frozen_cycle9.json")
          for name in (
              "ic_rectangular.py", "ic_hotspots.py", "ic_orientation.py",
              "ic_power_profiles.py", "ic_tl494_profile.py",
              "ic_electrical_binding.py", "ic_sheet_composition.py",
              "external_wire_sheet.py", "native_sheet_ink_audit.py",
              "routed_native_sheet.py", "sheet_svg.py",
          ):
              stage("paint", "src/gost_schematic/rendering/" + name)
          for name in (
              "render_tl494_new_router_cycle10.py",
              "render_tl494_compact_new_router_cycle10.py",
          ):
              stage("paint", "examples/" + name)
          stage("paint", "tests/test_routed_native_sheet_cycle10.py")
          stage("catalog", "tests/test_tl494_source_footprints.py")
          stage("catalog", "examples/review_tl494_ugo_source_cycle9.py")
          for name in ("source_profiles.py", "source_footprints.py"):
              stage("catalog", "src/gost_schematic/catalog/" + name)
          for name in (
              "tl494_source_20261114.json",
          ):
              stage("catalog", "src/gost_schematic/catalog/source_profiles/" + name)
          stage(
              "catalog",
              "src/gost_schematic/catalog/source_profiles/tl494_figure_comparisons_20261115.json",
          )
          for name in ("orthogonal_route_planner.py", "multiterminal_router.py"):
              stage("net", "src/gost_schematic/engines/" + name)
          stage("net", "src/gost_schematic/validation/route_drc.py")
          # The actual editor owner must consume the real PAINT modules too.
          for path in Path("_qa_sources/paint/src/gost_schematic/rendering").glob("ic_*.py"):
              dest = Path("_qa_sources/ic/src/gost_schematic/rendering") / path.name
              dest.parent.mkdir(parents=True, exist_ok=True)
              copy2(path, dest)
          # Verify source fixture bytes, not merely 23 nominal-looking entries.
          import subprocess
          out = subprocess.check_output(
              ["git", "-C", "_qa_sources/ic", "hash-object",
               "tests/fixtures/tl494_photo_23_frozen_cycle9.json"],
              text=True,
          ).strip()
          assert out == "a5c116d8745fadbc14d8f6869e1e7b0f97ff6d65"
          PY
      - name: Install cross-owner Python dependencies and Type A glyphs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -e "./_qa_sources/recon[dev,mcp,fonts]" cairosvg pillow
          ruff check scripts/qa_tl494_next_route_gate.py \
            scripts/qa_tl494_cycle10_candidate_gate.py \
            scripts/qa_tl494_current_editor_cycle10.py \
            scripts/qa_tl494_cycle11_native_300dpi.py \
            scripts/qa_install_opengost_release.py \
            tests/test_qa_font_direct_release.py
          python -m pytest -q tests/test_qa_font_direct_release.py
          python scripts/qa_install_opengost_release.py \
            --directory "$HOME/.local/share/fonts"
          fc-cache -f
          FONT="$(find "$HOME/.local/share/fonts" -iname '*TypeA*.ttf' -type f | head -1)"
          test -f "$FONT"
          echo "QA_C11_GOST_FONT=$FONT" >> "$GITHUB_ENV"
      - name: True live HEAD RECON + PAINT + NET + IC + YGO positive and hostile pytest
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/recon
          PYTHONPATH=src:. python -m compileall -q examples/tl494_v5 src/gost_schematic/electrical \
            src/gost_schematic/rendering/routed_native_sheet.py
          PYTHONPATH=src:. python -m pytest -q \
            examples/tl494_v5/test_native_circuit.py \
            examples/tl494_v5/test_compact_layout.py \
            examples/tl494_v5/test_route_candidate_driver.py \
            examples/tl494_v5/test_routed_graph_contract.py \
            tests/test_routed_native_sheet_cycle10.py \
            tests/test_tl494_source_footprints.py
      - name: Current exact HEAD 23-15-62 candidate and all 15 originally named Nets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/qa92-cycle11-${{ matrix.python-version }}
          cd _qa_sources/recon
          PYTHONPATH=src:. python -m examples.tl494_v5.route_candidate_driver \
            --font-file "$QA_C11_GOST_FONT" \
            --output-file "../../output/qa92-cycle11-${{ matrix.python-version }}/actual-recon-15-net-candidate.json" \
            --variants source --node-cap 5000
      - name: Separate independent QA of real accepted conductor graph and 8 source forgery negatives
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/original
          PYTHONPATH=src:. python scripts/qa_tl494_cycle10_candidate_gate.py \
            --cycle11 --frozen-root . \
            --recon-root ../recon \
            --ic-fixture ../ic/tests/fixtures/tl494_photo_23_frozen_cycle9.json \
            --live-ic ../ic --live-paint ../paint \
            --live-net ../net --live-catalog ../catalog \
            --candidate-report "../../output/qa92-cycle11-${{ matrix.python-version }}/actual-recon-15-net-candidate.json" \
            --output "../../output/qa92-cycle11-${{ matrix.python-version }}/independent-cycle11-source-matrix.json"
      - name: Current manufacturer #97 full typed 16 terminal/Net positive and 8 active negative cases
        shell: bash
        run: |
          set -euo pipefail
          cd _qa_sources/ic
          PYTHONPATH=src:. python scripts/qa_tl494_current_editor_cycle10.py \
            --cycle11 --font-file "$QA_C11_GOST_FONT" \
            --output "../../output/qa92-cycle11-${{ matrix.python-version }}/independent-TI-editor-matrix.json"
      - name: Authoritative real TI partID adapter on true 23/15/62 with seven negative source mutations
        shell: bash
        run: |
          set -euo pipefail
          ruff check scripts/qa_tl494_cycle11_part_bridge.py
          cd _qa_sources/recon
          PYTHONPATH=src:. python ../../scripts/qa_tl494_cycle11_part_bridge.py \
            --font-file "$QA_C11_GOST_FONT" \
            --output "../../output/qa92-cycle11-${{ matrix.python-version }}/manufacturer-PartID-source-bridge.json"
      - name: Genuine PAINT current HEAD 23-part new compact A3 routed native SVG, not old 91-wire redraw
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          cd _qa_sources/recon
          PYTHONPATH=src:. python -m examples.render_tl494_compact_new_router_cycle10 \
            --font-file "$QA_C11_GOST_FONT" \
            --output "../../output/qa92-cycle11-${{ matrix.python-version }}/paint-new-native" \
            --node-cap 5000
      - name: Independent QA source-faithful clean/debug SVG plus actual 300 DPI PNG
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          ruff check scripts/qa_tl494_cycle11_native_300dpi.py
          python scripts/qa_tl494_cycle11_native_300dpi.py \
            --source-dir "output/qa92-cycle11-${{ matrix.python-version }}/paint-new-native" \
            --output-dir "output/qa92-cycle11-${{ matrix.python-version }}/native-300dpi"
      - name: Exact-HEAD evidence including full run blockers, no fake PRINT PASS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa92-cycle11-current-owner-23-15-62-py${{ matrix.python-version }}
          path: output/qa92-cycle11-${{ matrix.python-version }}/
          if-no-files-found: warn
          retention-days: 30
