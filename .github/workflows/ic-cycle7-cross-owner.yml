name: PAINT C7 pinned ELEKTRIK E3 IC cross-source verification

on:
  pull_request:
    branches: [integration/stage0-12]
    paths:
      - "src/gost_schematic/rendering/ic_rectangular.py"
      - "src/gost_schematic/rendering/ic_orientation.py"
      - "src/gost_schematic/rendering/ic_hotspots.py"
      - "src/gost_schematic/rendering/ic_electrical_binding.py"
      - "examples/qa_ic_owner_binding.py"
      - ".github/workflows/ic-cycle7-cross-owner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-ic-model:
    runs-on: ubuntu-latest
    env:
      ELEKTRIK_SHA: 22a49e18f6603869d2c7d11d767c67f5abb988a7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Overlay genuine read-only ELEKTRIK owner source in ephemeral runner
        run: |
          git fetch --no-tags origin "$ELEKTRIK_SHA" --depth=1
          git archive "$ELEKTRIK_SHA" \
            src/gost_schematic/electrical \
            examples/review_ic_cycle7.py \
            tests/test_ic_paint_joint_cycle7.py \
            tests/fixtures/electrical-ic-cycle7 \
            | tar -xf -
          python -m pip install -e ".[dev]"
          ruff check src/gost_schematic/rendering/ic_rectangular.py \
            src/gost_schematic/rendering/ic_orientation.py \
            src/gost_schematic/rendering/ic_hotspots.py \
            src/gost_schematic/rendering/ic_electrical_binding.py \
            examples/qa_ic_owner_binding.py
      - name: Install real externally pinned OpenGost Type A
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/install_opengost_type_a.py \
            --expected-sha256 f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a \
            --directory "$HOME/.local/share/fonts"
          fc-cache -f
          FONT_FILE="$(find "$HOME/.local/share/fonts" -type f \( -iname '*TypeA*.ttf' -o -iname '*TypeA*.otf' \) | head -1)"
          test -f "$FONT_FILE"
          test "$(realpath "$FONT_FILE")" = "$(realpath "$(fc-match -f '%{file}' 'OpenGost Type A')")"
          echo "IC_TYPE_A_FONT_PATH=$FONT_FILE" >> "$GITHUB_ENV"
      - name: Execute owner 24+ genuine cross-PR tests, reject skips
        run: |
          pytest -q -rs tests/test_ic_paint_joint_cycle7.py \
            --strict-markers
          python -m examples.qa_ic_owner_binding
      - uses: actions/upload-artifact@v4
        with:
          name: draft-ic-cross-owner-proof
          path: output/ic-cycle7-joint/*
          if-no-files-found: error
