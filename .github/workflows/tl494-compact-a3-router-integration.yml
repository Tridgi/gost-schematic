name: TL494 23-part compact A3/A2 real Ink/PinRef route review

on:
  push:
    branches:
      - parallel/electrical-routing-drc-tl494-cycle9
    paths:
      - src/gost_schematic/engines/multiterminal_router.py
      - src/gost_schematic/validation/route_drc.py
      - examples/review_tl494_compact_cycle9.py
      - .github/workflows/tl494-compact-a3-router-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-a3:
    name: 23/15 real ${{ matrix.paper }} + 72 measured glyph guards (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            paper: A3
          - python-version: "3.13"
            paper: A3
          - python-version: "3.13"
            paper: A2
    env:
      PAPER: ${{ matrix.paper }}
    steps:
      - name: Checkout exact routed PR #114
        uses: actions/checkout@v4
      - name: Frozen initial TL494 SOURCE
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: e695c415fdced164b0e0c39c5249d030795a0aa6
          path: _owner_source
          persist-credentials: false
      - name: Frozen actual RECON compact A3
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: e56397300875ac155a316a9bfebe2601358a4147
          path: _owner_recon
          persist-credentials: false
      - name: Frozen ELEKTRIK IC physical model
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: 6161e9102cbc0c9e0491fb27ed7a496dc0b274bc
          path: _owner_ic
          persist-credentials: false
      - name: Frozen catalog owner 13 source symbols
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: edc71a48035723d48a203ae2ea12588701f68ba8
          path: _owner_ygo
          persist-credentials: false
      - name: Frozen PAINT actual 16 physical IC leads
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: e3ea841dbe087952577121d5690fe41e9a9a5c83
          path: _owner_paint
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native system dependencies
        run: |
          python -m pip install -e ".[dev,mcp]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fontconfig
      - name: Source-check physical immutable owner contracts in isolated CI ONLY
        run: |
          set -euo pipefail
          test "$(git -C _owner_source rev-parse HEAD)" = e695c415fdced164b0e0c39c5249d030795a0aa6
          test "$(git -C _owner_recon rev-parse HEAD)" = e56397300875ac155a316a9bfebe2601358a4147
          test "$(git -C _owner_ic rev-parse HEAD)" = 6161e9102cbc0c9e0491fb27ed7a496dc0b274bc
          test "$(git -C _owner_ygo rev-parse HEAD)" = edc71a48035723d48a203ae2ea12588701f68ba8
          test "$(git -C _owner_paint rev-parse HEAD)" = e3ea841dbe087952577121d5690fe41e9a9a5c83
          for F in tl494_native_rework tl494_connected_native tl494_full_native_model tl494_ic_paint_reference tl494_named_photo_sheet; do
            cp "_owner_source/examples/$F.py" "examples/$F.py"
          done
          cp -a _owner_recon/examples/tl494_v4 examples/
          cp -a _owner_recon/examples/tl494_v5 examples/
          for F in contacts ic ic_agent_snapshot ic_editor_targets ic_power_presentation tl494cn ic_pin_alias ic_serde ic_paint_bridge ic_graphic_revision; do
            cp "_owner_ic/src/gost_schematic/electrical/$F.py" "src/gost_schematic/electrical/$F.py"
          done
          mkdir -p src/gost_schematic/catalog/source_profiles
          cp _owner_ygo/src/gost_schematic/catalog/source_profiles.py src/gost_schematic/catalog/source_profiles.py
          cp _owner_ygo/src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json src/gost_schematic/catalog/source_profiles/tl494_source_20261114.json
          for F in ic_rectangular ic_hotspots ic_orientation ic_power_profiles ic_tl494_profile ic_electrical_binding; do
            cp "_owner_paint/src/gost_schematic/rendering/$F.py" "src/gost_schematic/rendering/$F.py"
          done
          python -m compileall -q examples/review_tl494_compact_cycle9.py examples/tl494_v5/
      - name: Install pinned modern measured OpenGOST Type A font
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/install_opengost_type_a.py \
            --directory "$HOME/.local/share/fonts" \
            --expected-sha256 f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
          fc-cache -f
      - name: Route actual 23-part A3/A2; A2 tests paper, not changed Net
        run: |
          set -euo pipefail
          OUT="output/compact-$PAPER"
          mkdir -p "$OUT"
          FONT="$(find "$HOME/.local/share/fonts" -name '*TypeA*' -type f -print -quit)"
          test -f "$FONT"
          TRIALS=2
          if [ "$PAPER" = "A2" ]; then TRIALS=1; fi
          python -m examples.review_tl494_compact_cycle9 \
            --font-file "$FONT" \
            --owner-sha "$GITHUB_SHA" \
            --reference-sha e56397300875ac155a316a9bfebe2601358a4147 \
            --max-nodes 25000 \
            --page-format "$PAPER" \
            --priority-trials "$TRIALS" \
            --output "$OUT" \
            2>&1 | tee "$OUT/owner-route-trace.log"
      - name: Check actual 23/15/16/62 and blocked-safe native SVG
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          paper = os.environ["PAPER"]
          out = Path(f"output/compact-{paper}")
          data = json.loads((out / f"TL494-compact-{paper}-route-drc.json").read_text())
          assert (data["source_components"], data["source_nets"],
                  data["physical_DA1_pin_count"],
                  data["all_Circuit_PinRef_memberships"]) == (23, 15, 16, 62)
          assert data["source_net_diff"] == {
              "added": [], "removed": [], "physical_members_changed": [],
          }
          assert data["measured_annotation_guards"] >= 39
          assert data["real_source_UGO_draft_count"] == 13
          assert "VT1" in data["actual_source_UGO_authority"]
          assert all(
              item["status"] == "draft" and item["figure"]
              for item in data["actual_source_UGO_authority"].values()
          )
          assert data["VT1_source_UGO_normative_approved"] is False
          assert len(data["routing"]["net_trees"]) == 15
          assert data["routed_nets"] <= 15
          assert data["new_after_drc"]["checked_symbol_geometry"]
          assert data["new_after_drc"]["checked_measured_text"]
          assert data["print_pass"] is False
          S = "{http://www.w3.org/2000/svg}"
          for name in ("clean", "diagnostic"):
              root = ET.parse(out / f"TL494-compact-{paper}-{name}.svg").getroot()
              assert root.get("data-draft-paper") == paper
              assert root.get("data-owner-router-sha") == data["owner_router_sha"]
              assert root.get("data-physical-net-diff") == "ZERO"
              assert len(root.findall(
                  f".//{S}line[@data-layer='wires']",
              )) == data["routed_segments"]
              real_ic = root.find(
                  f".//{S}g[@data-ink-source='real-native-PAINT-original-16leads']"
              )
              assert real_ic is not None
              assert len(real_ic.findall(
                  f".//{S}g[@data-layer='ic-physical-pin-leads']/{S}line"
              )) == 16
              targets = root.find(
                  f".//{S}g[@data-layer='editor-connection-targets']"
              )
              if name == "clean":
                  assert targets is None
              else:
                  assert targets is not None
                  squares = targets.findall(f"./{S}rect")
                  assert len(squares) == 16
                  assert {x.get("data-pin-ref") for x in squares} == {
                      f"DA1.{n}" for n in range(1, 17)
                  }
                  assert all(x.get("fill") == "#148645" for x in squares)
                  assert targets.get("data-physical-print") == "false"
          if data["routed_nets"] < 15 or not data["geom_drc_pass"]:
              assert data["status"] == "BLOCKED_PARTIAL_NOT_PRINTABLE"
          print("ACTUAL", paper, "source 23/15/16/62 and unapproved print",
                data["routed_nets"], data["new_after_drc"]["error_count"])
          PY
      - name: Real 300 DPI native A3/A2 DRAFT preview raster
        run: |
          for MODE in clean diagnostic; do
            rsvg-convert --background-color white --dpi-x 300 --dpi-y 300 \
              --output "output/compact-$PAPER/TL494-compact-$PAPER-$MODE-300dpi.png" \
              "output/compact-$PAPER/TL494-compact-$PAPER-$MODE.svg"
          done
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image

          for mode in ("clean", "diagnostic"):
              paper = os.environ["PAPER"]
              prefix = Path(f"output/compact-{paper}/TL494-compact-{paper}-{mode}")
              svg = ET.parse(prefix.with_suffix(".svg")).getroot()
              width, height = (svg.get("width"), svg.get("height"))
              assert width.endswith("mm") and height.endswith("mm")
              path = Path(str(prefix) + "-300dpi.png")
              with Image.open(path) as image:
                  assert image.format == "PNG"
                  assert image.width > 1000 and image.height > 1000
                  expected = (round(float(width[:-2]) / 25.4 * 300),
                              round(float(height[:-2]) / 25.4 * 300))
                  assert abs(image.width - expected[0]) < 4
                  assert abs(image.height - expected[1]) < 4
                  image.save(path, dpi=(300, 300))
              with Image.open(path) as checked:
                  density = checked.info.get("dpi")
                  assert density is not None
                  assert all(abs(x-300) < 1 for x in density)
          print("Native SVG physical millimetres + real 300DPI PNG metadata verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-114-compact-${{ matrix.paper }}-source-23net-${{ matrix.python-version }}
          path: output/compact-${{ matrix.paper }}/
          if-no-files-found: warn
