name: TL494 native reference pytest and Ruff

on:
  push:
    branches:
      - reference/tl494-native-rework-20261114
    paths:
      - tests/test_tl494_reference_native.py
      - examples/tl494_native_rework.py
      - examples/tl494_full_native_model.py
      - .github/workflows/tl494-native-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' 'ruff>=0.9,<1'
      - name: Run independent code and physics model quality checks
        id: run
        continue-on-error: true
        run: |
          set +e
          mkdir -p examples/tl494_qa_output
          PYTHONPATH=src python -m pytest -q tests/test_tl494_reference_native.py \
             > examples/tl494_qa_output/pytest.txt 2>&1
          T=$?
          python -m ruff check --select F,E4,E7,E9 \
             tests/test_tl494_reference_native.py \
             examples/tl494_native_rework.py \
             examples/tl494_full_native_model.py \
             > examples/tl494_qa_output/ruff.txt 2>&1
          R=$?
          echo "PYTEST_EXIT_CODE=$T" >> examples/tl494_qa_output/pytest.txt
          echo "RUFF_EXIT_CODE=$R" >> examples/tl494_qa_output/ruff.txt
          cat examples/tl494_qa_output/pytest.txt
          cat examples/tl494_qa_output/ruff.txt
          if [ "$T" -ne 0 ] || [ "$R" -ne 0 ]; then exit 1; fi
      - name: Preserve actual test logs even on failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f examples/tl494_qa_output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(reference): record TL494 engine pytest/ruff evidence"
          git fetch origin reference/tl494-native-rework-20261114
          git rebase FETCH_HEAD
          git push origin HEAD:reference/tl494-native-rework-20261114
