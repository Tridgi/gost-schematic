name: Visual CAD CHAT8 export v2 / SVG-PNG metrology

on:
  pull_request:
    branches: ["ui/visual-cad-mvp"]
    paths:
      - "ui/bridge/export/**"
      - "ui/editor/src/export/**"
      - ".github/workflows/visual-cad-chat8-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-v2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact export and model test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "jsonschema>=4.26,<5" "CairoSVG==2.9.1" "Pillow>=12.3,<13"
      - name: Lint export module
        run: python -m ruff check ui/bridge/export
      - name: Run real SVG and PNG300, E695 project v2 contract
        run: python -m pytest -q ui/bridge/export/tests
