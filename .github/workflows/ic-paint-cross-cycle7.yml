name: Cycle7 ELEKTRIK-PAINT exact IC cross-contract (DRAFT)

on:
  push:
    branches:
      - parallel/electrical-ic-contract-cycle7
  pull_request:
    paths:
      - 'src/gost_schematic/electrical/**'
      - 'tests/test_ic_paint_joint_cycle7.py'
      - 'tests/test_ic_graphic_profile_cycle7.py'
      - 'tests/test_ic_editor_power_cycle7.py'
      - 'examples/review_ic_editor_cycle7.py'
      - 'scripts/verify_ic_editor_raster_cycle7.py'
      - 'scripts/verify_ic_joint_visual_evidence.py'
      - 'examples/review_ic_paint_joint_cycle7.py'
      - 'examples/review_ic_text_profile_cycle7.py'
      - '.github/workflows/ic-paint-cross-cycle7.yml'
  workflow_dispatch:

jobs:
  true-source-joint-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout ELEKTRIK #97 working branch
        uses: actions/checkout@v4
      - name: Checkout immutable PAINT #93 source snapshot
        uses: actions/checkout@v4
        with:
          repository: Tridgi/gost-schematic
          ref: db53e0ab89bb23f555badc2def41ea9895a5d64c
          path: _paint_review_snapshot
          persist-credentials: false
      - name: Verify exact PAINT revision, load complete renderer dependencies for CI only
        shell: bash
        run: |
          test "$(git -C _paint_review_snapshot rev-parse HEAD)" = 'db53e0ab89bb23f555badc2def41ea9895a5d64c'
          for part in ic_rectangular ic_orientation ic_hotspots; do
            test ! -e "src/gost_schematic/rendering/$part.py"
            cp "_paint_review_snapshot/src/gost_schematic/rendering/$part.py" "src/gost_schematic/rendering/$part.py"
          done
          echo 'PAINT three modules loaded only in ephemeral CI checkout; no source branch merges.'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact physical-model project
        run: python -m pip install -e '.[dev,mcp]'
      - name: Install SHA-checked real OpenGost Type A
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/install_opengost_type_a.py --directory "$HOME/.local/share/fonts" --expected-sha256 f77d96f832b7c902d42fc391fddf15b622c1eadeb263dd31b926888d72e0773a
          FONT_PATH="$(find "$HOME/.local/share/fonts" -type f \( -iname '*TypeA*.ttf' -o -iname '*TypeA*.otf' \) | head -1)"
          test -n "$FONT_PATH"
          echo "IC_TYPE_A_FONT_PATH=$FONT_PATH" >> "$GITHUB_ENV"
          fc-cache -f
      - name: Ruff (owner-owned new files and joint tests)
        run: ruff check src/gost_schematic/electrical/ic.py src/gost_schematic/electrical/ic_serde.py src/gost_schematic/electrical/ic_graphic_revision.py src/gost_schematic/electrical/ic_agent_snapshot.py src/gost_schematic/electrical/ic_paint_bridge.py src/gost_schematic/electrical/ic_editor_targets.py src/gost_schematic/electrical/ic_power_presentation.py tests/test_ic_paint_joint_cycle7.py tests/test_ic_graphic_profile_cycle7.py tests/test_ic_editor_power_cycle7.py examples/review_ic_paint_joint_cycle7.py examples/review_ic_text_profile_cycle7.py examples/review_ic_editor_cycle7.py scripts/verify_ic_joint_visual_evidence.py scripts/verify_ic_editor_raster_cycle7.py scripts/stamp_ic_joint_300dpi_metadata.py
      - name: Reproduce joint DA8 and split DD14/DD40/DD64 SVG + physical Circuit QA manifest
        if: matrix.python-version == '3.12'
        run: |
          python -m examples.review_ic_paint_joint_cycle7 --font-file "$IC_TYPE_A_FONT_PATH" --output-dir output/ic-paint-joint-cycle7
      - name: Rasterize actual physical 300 DPI previews
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for src in output/ic-paint-joint-cycle7/*.svg; do
            rsvg-convert --dpi-x 300 --dpi-y 300 "$src" -o "${src%.svg}.png"
          done
          python scripts/stamp_ic_joint_300dpi_metadata.py --output-dir output/ic-paint-joint-cycle7
          python scripts/verify_ic_joint_visual_evidence.py --output-dir output/ic-paint-joint-cycle7
          ( cd output/ic-paint-joint-cycle7 && sha256sum *.svg *.png *.json > SHA256SUMS.txt )
      - name: Reproduce DRAFT PWM portrait/vertical paired-model evidence
        if: matrix.python-version == '3.12'
        run: |
          python -m examples.review_ic_text_profile_cycle7 --font-file "$IC_TYPE_A_FONT_PATH" --output-dir output/ic-pwm-profile-cycle7
          images="$(find output/ic-pwm-profile-cycle7 -maxdepth 1 -name '*.svg' -type f | wc -l)"
          test "$images" -gt 0
          for src in output/ic-pwm-profile-cycle7/*.svg; do
            rsvg-convert --dpi-x 300 --dpi-y 300 "$src" -o "${src%.svg}.png"
          done
          python scripts/stamp_ic_joint_300dpi_metadata.py --output-dir output/ic-pwm-profile-cycle7 --expected-count "$images"
          ( cd output/ic-pwm-profile-cycle7 && sha256sum *.svg *.png *.json > SHA256SUMS.txt )
      - name: Real E3 physical PinRef diagnostic/clean 300DPI gallery
        if: matrix.python-version == '3.12'
        run: |
          python -m examples.review_ic_editor_cycle7 --font-file "$IC_TYPE_A_FONT_PATH" --output-dir output/ic-editor-contacts-cycle7
          test "$(find output/ic-editor-contacts-cycle7 -maxdepth 1 -name '*.svg' -type f | wc -l)" -eq 28
          for src in output/ic-editor-contacts-cycle7/*.svg; do
            rsvg-convert --dpi-x 300 --dpi-y 300 "$src" -o "${src%.svg}.png"
          done
          python scripts/stamp_ic_joint_300dpi_metadata.py --output-dir output/ic-editor-contacts-cycle7 --expected-count 28
          python scripts/verify_ic_editor_raster_cycle7.py --output-dir output/ic-editor-contacts-cycle7
          ( cd output/ic-editor-contacts-cycle7 && sha256sum *.svg *.png *.json > SHA256SUMS.txt )
      - name: Upload full typed physical pin/editor diagnostic artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-cycle7-real-pinref-editor-green-red-300dpi
          path: output/ic-editor-contacts-cycle7/
          if-no-files-found: error
      - name: Upload paired 0/90 physical-model orientation evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-cycle7-pwm-model-text-0-90-physical-net-proof
          path: output/ic-pwm-profile-cycle7/
          if-no-files-found: error
      - name: Upload reproducible joint QA evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-cycle7-real-model-paint-joint-qa
          path: output/ic-paint-joint-cycle7/
          if-no-files-found: error
      - name: Assert both packages exist and execute true 1um boundary tests
        run: |
          python -c 'import gost_schematic.electrical.ic_paint_bridge, gost_schematic.rendering.ic_rectangular'
          pytest -q -ra tests/test_ic_paint_joint_cycle7.py tests/test_ic_graphic_profile_cycle7.py tests/test_ic_editor_power_cycle7.py
