name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Render draft resistor for manual approval
        run: python -m gost_schematic.cli render-symbol src/gost_schematic/catalog/symbols/resistors/fixed.json --output output/resistor-review.svg --review-overlay
      - name: Publish UGO review artifact
        uses: actions/upload-artifact@v4
        with:
          name: resistor-review-${{ matrix.python-version }}
          path: output/resistor-review.svg
