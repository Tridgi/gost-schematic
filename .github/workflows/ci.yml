name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Generate collision-overlay sample (technical font only)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          FONT_PATH="$(fc-match -f '%{file}' 'DejaVu Sans')"
          if [ ! -f "$FONT_PATH" ]; then
            echo "::warning::No example TTF available; SVG review sample omitted."
            exit 0
          fi
          python -m gost_schematic.cli render-annotated-symbol \
            src/gost_schematic/catalog/symbols/resistors/fixed.json \
            --ref R1 --value '10 kΩ' --font-file "$FONT_PATH" \
            --font-family 'DejaVu Sans' --review-overlay \
            --output output/resistor-annotations-review.svg
          python -m gost_schematic.cli render-annotated-symbol \
            src/gost_schematic/catalog/symbols/resistors/fixed.json \
            --ref R1 --value '10 kΩ' --font-file "$FONT_PATH" \
            --font-family 'DejaVu Sans' \
            --output output/resistor-annotations-clean.svg
          python -m gost_schematic.cli render-annotated-symbol \
            src/gost_schematic/catalog/symbols/resistors/fixed.json \
            --ref R1 --value '10 kΩ' --font-file "$FONT_PATH" \
            --font-family 'DejaVu Sans' --show-pin-connections --review-overlay \
            --output output/resistor-annotations-pin-escape.svg
      - name: Generate ESKD/full/hidden nominal previews
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          FONT_PATH="$(fc-match -f '%{file}' 'DejaVu Sans')"
          if [ ! -f "$FONT_PATH" ]; then
            echo "::warning::No sample font; nominal previews skipped."
            exit 0
          fi
          for MODE in eskd_compact full_units; do
            python -m gost_schematic.cli render-annotated-symbol \
              src/gost_schematic/catalog/symbols/resistors/fixed.json \
              --nominal 2300 --unit ohm --nominal-mode "$MODE" \
              --font-file "$FONT_PATH" --font-family 'DejaVu Sans' \
              --review-overlay --output "output/nominal-$MODE.svg"
          done
          python -m gost_schematic.cli render-annotated-symbol \
            src/gost_schematic/catalog/symbols/resistors/fixed.json \
            --nominal 2300 --unit ohm --hide-nominal \
            --font-file "$FONT_PATH" --font-family 'DejaVu Sans' \
            --review-overlay --output output/nominal-hidden.svg
      - name: Generate multi-resistor sheet samples
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          FONT_PATH="$(fc-match -f '%{file}' 'DejaVu Sans')"
          if [ ! -f "$FONT_PATH" ]; then
            echo "::warning::No sample font; sheet preview omitted."
            exit 0
          fi
          python examples/review_sheet_annotations.py \
            --font-file "$FONT_PATH" --font-family 'DejaVu Sans' \
            --output-dir output/sheet-review
      - name: Upload sheet label review samples
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sheet-label-geometry-review
          path: output/sheet-review/*.svg
          if-no-files-found: warn
      - name: Install open-license OpenGOST Type A for sample render
        if: matrix.python-version == '3.12'
        run: |
          python scripts/install_opengost_type_a.py \
            --directory "$HOME/.local/share/fonts"
          fc-cache -f
      - name: Generate GOST Type A capacitor review
        if: matrix.python-version == '3.12'
        run: |
          FONT_FILE="$(find "$HOME/.local/share/fonts" -type f \
            -iname '*TypeA*.ttf' -o -iname '*TypeA*.otf' | head -1)"
          test -n "$FONT_FILE"
          python examples/review_type_a_capacitors.py \
            --font-file "$FONT_FILE" --font-family "OpenGost Type A" \
            --output-dir output/type-a-capacitors
      - name: Upload Type A and capacitor SVG
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-type-a-capacitors
          path: output/type-a-capacitors/*.svg
          if-no-files-found: error
      - name: Upload nominal display samples
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-eskd-nominal-display
          path: output/nominal-*.svg
          if-no-files-found: warn
      - name: Upload annotated UGO preview
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: draft-resistor-annotation-review
          path: output/resistor-annotations-*.svg
          if-no-files-found: warn
